<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#56272c" />
    <meta name="description" content="走进肖依婷的小房间，翻阅 AI 产品经理的实习与项目作品。" />
    <meta property="og:title" content="肖依婷的小房间 | AI 产品经理作品集" />
    <meta property="og:description" content="关于我、实习、项目、技能和联系方式，都藏在五幅猫咪挂画里。" />
    <meta property="og:image" content="assets/images/room/bedroom.webp" />
    <title>肖依婷的小房间 | AI 产品经理作品集</title>
    <link rel="stylesheet" href="assets/css/bedroom.css" />
  </head>
  <body>
    <a class="skip-link" href="#gallery">跳到作品入口</a>
    <div class="site-world">
      <header class="site-brand">
        <a class="fabric-title" href="#home" aria-label="依婷的小房间，返回首页">
          <span aria-hidden="true">依</span><span aria-hidden="true">婷</span><span aria-hidden="true">的</span><span aria-hidden="true">小</span><span aria-hidden="true">房</span><span aria-hidden="true">间</span>
        </a>
        <p>求职意向：AI 产品经理实习｜大模型应用 / 通用大模型</p>
      </header>

      <main class="room-stage" id="main">
        <div class="room-backdrop" aria-hidden="true"></div>
        <nav class="gallery-wall" id="gallery" aria-label="小猫挂画，选择作品章节">
          <button class="cat-frame" type="button" data-page="about" style="--tilt:-3deg">
            <span class="frame-art"><img src="assets/images/room/cat-about.webp" alt="" /></span>
            <span class="frame-label">关于我</span>
          </button>
          <button class="cat-frame" type="button" data-page="internships" style="--tilt:2deg">
            <span class="frame-art"><img src="assets/images/room/cat-internship.webp" alt="" /></span>
            <span class="frame-label">实习经历</span>
          </button>
          <button class="cat-frame" type="button" data-page="projects" style="--tilt:-2deg">
            <span class="frame-art"><img src="assets/images/room/cat-projects.webp" alt="" /></span>
            <span class="frame-label">项目作品</span>
          </button>
          <button class="cat-frame" type="button" data-page="skills" style="--tilt:3deg">
            <span class="frame-art"><img src="assets/images/room/cat-skills.webp" alt="" /></span>
            <span class="frame-label">技能与教育</span>
          </button>
          <button class="cat-frame" type="button" data-page="contact" style="--tilt:-1deg">
            <span class="frame-art"><img src="assets/images/room/cat-contact.webp" alt="" /></span>
            <span class="frame-label">联系我</span>
          </button>
        </nav>
        <p class="room-instruction">点开一幅猫咪画，翻翻我的作品杂志 <span aria-hidden="true">↗</span></p>
        <p class="room-caption">A LITTLE ROOM OF WORK & IDEAS · 2026</p>
      </main>
    </div>

    <dialog class="magazine-dialog" id="magazine" aria-label="肖依婷的作品杂志">
      <div class="magazine-shell">
        <header class="magazine-toolbar">
          <button class="back-to-room" type="button" data-close-magazine>← 回到房间</button>
          <span class="magazine-mark">YITING'S JOURNAL</span>
          <span class="page-count" data-page-count></span>
        </header>
        <div class="magazine-layout">
          <nav class="chapter-tabs" aria-label="杂志章节">
            <button type="button" data-page="about">关于我</button>
            <button type="button" data-page="internships">实习</button>
            <button type="button" data-page="projects">项目</button>
            <button type="button" data-page="skills">技能</button>
            <button type="button" data-page="contact">联系</button>
          </nav>
          <div class="book">
            <div class="book-spine" aria-hidden="true"></div>
            <article class="paper-page" data-paper-page tabindex="-1"></article>
          </div>
        </div>
        <footer class="magazine-footer">
          <button type="button" data-prev-page aria-label="上一页">← 上一页</button>
          <span data-page-title></span>
          <button type="button" data-next-page aria-label="下一页">下一页 →</button>
        </footer>
      </div>
    </dialog>

    <script src="content/portfolio-data.js"></script>
    <script src="assets/js/bedroom.js"></script>
  </body>
</html>
