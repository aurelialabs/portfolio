<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>肖依婷 | AI 产品经理实习作品集</title>
    <meta name="description" content="肖依婷的 AI 产品经理实习作品集，关注大模型应用与通用大模型产品，展示智能客服和 AI 学习产品实践。" />
    <meta name="theme-color" content="#10213f" />
    <meta property="og:title" content="肖依婷 | AI 产品经理实习作品集" />
    <meta property="og:description" content="大模型应用与通用大模型产品方向，展示智能客服和 AI 学习产品实践。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/images/portrait.jpg" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <a class="skip-link" href="#main">跳到主要内容</a>

      <header class="site-header">
        <nav class="nav-shell" aria-label="主导航">
          <a class="brand" href="#home" data-home-link>
            <span data-profile-name>肖依婷</span>
            <small>AI 产品经理</small>
          </a>
          <div class="nav-links" role="group" aria-label="作品集视图">
            <button type="button" data-view-target="home">首页</button>
            <button type="button" data-view-target="internship">实习</button>
            <button type="button" data-view-target="project">项目</button>
          </div>
        </nav>
      </header>

      <p class="visually-hidden" data-view-announcement aria-live="polite" aria-atomic="true"></p>

      <main id="main">
        <section class="view view-home" data-view="home" aria-labelledby="home-title">
          <div class="home-layout">
            <div class="home-profile">
              <p class="eyebrow" data-profile-target-role>AI 产品经理实习｜大模型应用 · 通用大模型</p>
              <h1 id="home-title" tabindex="-1" data-view-heading><span data-profile-name>肖依婷</span></h1>
              <p data-profile-school>南京师范大学</p>
              <p data-profile-education>教育技术学硕士在读</p>
              <p data-profile-background>计算机人工智能</p>
              <p class="content-error" data-content-error role="status" hidden></p>
              <dl class="profile-facts">
                <div>
                  <dt>所在城市</dt>
                  <dd data-profile-city>上海</dd>
                </div>
                <div>
                  <dt>联系邮箱</dt>
                  <dd><a data-profile-email href="mailto:13548674215@163.com">13548674215@163.com</a></dd>
                </div>
                <div>
                  <dt>联系电话</dt>
                  <dd><a data-profile-phone href="tel:13548674215">13548674215</a></dd>
                </div>
              </dl>
            </div>
            <figure class="home-portrait">
              <img data-profile-portrait src="assets/images/portrait.jpg" width="520" height="650" alt="肖依婷职业照" />
            </figure>
            <div class="home-entry-actions" aria-label="浏览作品">
              <button type="button" data-entry-view="internship">查看实习经历</button>
              <button type="button" data-entry-view="project">查看项目作品</button>
            </div>
          </div>
        </section>

        <section class="view workspace-view" data-view="internship" aria-labelledby="internship-title" hidden>
          <div class="workspace">
            <aside class="entry-sidebar" aria-label="实习经历导航">
              <h2 id="internship-title" tabindex="-1" data-view-heading>实习经历</h2>
              <nav aria-label="实习经历条目">
                <div data-entry-nav="internships" role="tablist" aria-label="实习经历条目"></div>
              </nav>
            </aside>
            <article class="detail-scroll" data-detail-scroll data-entry-detail="internships" role="tabpanel" id="internships-panel" tabindex="0"></article>
          </div>
        </section>

        <section class="view workspace-view" data-view="project" aria-labelledby="project-title" hidden>
          <div class="workspace">
            <aside class="entry-sidebar" aria-label="项目作品导航">
              <h2 id="project-title" tabindex="-1" data-view-heading>项目作品</h2>
              <nav aria-label="项目作品条目">
                <div data-entry-nav="projects" role="tablist" aria-label="项目作品条目"></div>
              </nav>
            </aside>
            <article class="detail-scroll" data-detail-scroll data-entry-detail="projects" role="tabpanel" id="projects-panel" tabindex="0"></article>
          </div>
        </section>
      </main>
    </div>

    <dialog data-lightbox aria-label="图片预览">
      <figure>
        <img data-lightbox-image alt="" />
        <figcaption data-lightbox-caption></figcaption>
      </figure>
      <button type="button" data-lightbox-close>关闭图片预览</button>
    </dialog>

    <script src="content/portfolio-data.js"></script>
    <script src="assets/js/content-model.js"></script>
    <script src="assets/js/main.js"></script>
  </body>
</html>
